<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观看历史 - LibreTV</title>
    <meta name="description" content="查看您在LibreTV上的观看历史记录，轻松找回您喜爱的视频内容。">
    <meta name="keywords" content="观看历史,历史记录,视频历史,LibreTV">
    <meta name="author" content="LibreTV Team">
    
    <!-- Favicon -->
    <link rel="icon" href="https://images.icon-icons.com/38/PNG/512/retrotv_5520.png">
    <link rel="apple-touch-icon" href="https://images.icon-icons.com/38/PNG/512/retrotv_5520.png">
    <link rel="manifest" href="manifest.json">
    
    <script src="libs/tailwindcss.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-bg text-white">
    <!-- 历史记录页面 -->
    <div id="historyPage" class="flex-1 flex flex-col items-center justify-start pt-16 pb-16">
        <div class="w-full max-w-2xl px-4">
            <h2 class="text-2xl font-bold gradient-text mb-4">观看历史</h2>
            <div id="historyList" class="w-full">
                <!-- 历史记录将在这里动态显示 -->
                <div class="text-center text-gray-500 py-8">暂无观看记录</div>
            </div>
            <div class="mt-4 text-center sticky bottom-0 pb-2 pt-2 bg-[#111]">
                <button onclick="clearViewingHistory()" class="px-4 py-2 w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600 text-white rounded-lg text-sm transition-all duration-300 shadow-md hover:shadow-lg">
                    清空历史记录
                </button>
            </div>
        </div>
    </div>

    <!-- 网站标志和口号 -->
    <header class="fixed top-0 left-0 right-0 h-11 flex items-center justify-center bg-[#0a0a0a] border-b border-[#333] z-30 shadow-md backdrop-blur-md">
        <div class="flex items-center">
            <a href="index.html" class="flex items-center">
                <svg class="w-6 h-6 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <h1 class="text-2xl font-bold gradient-text">LibreTV</h1>
            </a>
            <p class="text-gray-400 text-sm ml-2 hidden sm:block">自由观影，畅享精彩</p>
        </div>
    </header>

    <!-- 添加底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 h-14 bg-[#0a0a0a] border-t border-[#333] flex justify-around items-center px-2 z-30 bottom-nav">
        <!-- 首页按钮 -->
        <a href="index.html" class="flex flex-col items-center justify-center w-1/4 text-white text-xs bottom-nav-button" id="nav-home">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span>首页</span>
        </a>
        
        <!-- 搜索按钮 -->
        <a href="search.html" class="flex flex-col items-center justify-center w-1/4 text-white text-xs bottom-nav-button" id="nav-search">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span>搜索</span>
        </a>
        
        <!-- 历史记录按钮 -->
        <a href="history.html" class="flex flex-col items-center justify-center w-1/4 text-white text-xs bottom-nav-button active" id="nav-history">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>历史</span>
        </a>
        
        <!-- 设置按钮 -->
        <a href="settings.html" class="flex flex-col items-center justify-center w-1/4 text-white text-xs bottom-nav-button" id="nav-settings">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>设置</span>
        </a>
    </nav>

    <!-- 详情模态框 -->
    <div id="modal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center transition-opacity duration-300 z-40">
        <div class="bg-[#111] p-8 rounded-lg w-11/12 max-w-4xl border border-[#333] max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 id="modalTitle" class="text-2xl font-bold gradient-text break-words pr-4 max-w-[80%]"></h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl transition-colors flex-shrink-0">&times;</button>
            </div>
            <div id="modalContent" class="overflow-auto flex-1 min-h-0">
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
                </div>
            </div>
        </div>
    </div>

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="bg-[#111] p-8 rounded-lg border border-[#333] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- 错误提示框 -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 -translate-y-full">
        <p id="toastMessage"></p>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/password.js"></script>
    <script src="js/app.js"></script>

    <script>
        // 页面加载完成后初始化历史页面
        document.addEventListener('DOMContentLoaded', function() {
            // 渲染历史记录
            if (typeof renderViewingHistory === 'function') {
                renderViewingHistory();
            } else {
                console.error('renderViewingHistory函数未定义');
                // 尝试显示一个默认消息
                const historyList = document.getElementById('historyList');
                if (historyList) {
                    historyList.innerHTML = '<div class="text-center py-8 text-gray-500">暂无观看记录</div>';
                }
            }
            
            // 设置导航栏状态
            document.querySelectorAll('.bottom-nav-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav-history').classList.add('active');
            
            // 检查密码保护状态
            if (typeof safeCheckPasswordProtection === 'function') {
                safeCheckPasswordProtection();
            } else if (typeof checkPasswordProtection === 'function') {
                checkPasswordProtection();
            }
        });
    </script>

    <!-- PWA 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            // 只在HTTP/HTTPS环境下注册ServiceWorker
            if (window.location.protocol === 'https:' || window.location.protocol === 'http:') {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/service-worker.js');
                });
            } else {
                console.warn('ServiceWorker只能在HTTP/HTTPS环境下注册，当前使用的是' + window.location.protocol + '协议');
            }
        }
    </script>
</body>
</html>
