<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - LibreTV</title>
    <meta name="description" content="管理您的LibreTV设置，自定义视频源和内容过滤选项。">
    <meta name="keywords" content="设置,自定义,视频源,内容过滤,LibreTV">
    <meta name="author" content="LibreTV Team">
    
    <!-- Favicon -->
    <link rel="icon" href="https://images.icon-icons.com/38/PNG/512/retrotv_5520.png">
    <link rel="apple-touch-icon" href="https://images.icon-icons.com/38/PNG/512/retrotv_5520.png">
    <link rel="manifest" href="manifest.json">
    
    <script src="libs/tailwindcss.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 目录导航样式 */
        .settings-directory {
            width: 100%;
        }
        
        .directory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #151515;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        
        .directory-item:active {
            background-color: #222;
            transform: scale(0.98);
        }
        
        .directory-item-left {
            display: flex;
            align-items: center;
        }
        
        .directory-item-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            color: #8B5CF6;
        }
        
        .directory-item-title {
            font-size: 16px;
            font-weight: 500;
            color: #f3f4f6;
        }
        
        .directory-item-right svg {
            color: #666;
        }
        
        .settings-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .settings-section.active {
            display: block;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .back-button {
            background: none;
            border: none;
            color: #8B5CF6;
            display: flex;
            align-items: center;
            padding: 0;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f3f4f6;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(20px); }
        }
    </style>
</head>
<body class="page-bg text-white">
    <!-- 设置页面 -->
    <div id="settingsPage" class="flex-1 flex flex-col items-center justify-start pt-16 pb-16">
        <div class="w-full max-w-md px-4">
            <!-- <h2 class="text-2xl font-bold gradient-text mb-4 text-center">设置</h2> -->
            
            <!-- 设置目录 -->
            <div id="settings-directory" class="settings-directory">
                <div class="directory-item" data-target="data-source-section">
                    <div class="directory-item-left">
                        <svg class="directory-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <span class="directory-item-title">数据源设置</span>
                    </div>
                    <div class="directory-item-right">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
                
                <div class="directory-item" data-target="custom-api-section">
                    <div class="directory-item-left">
                        <svg class="directory-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <span class="directory-item-title">自定义API</span>
                    </div>
                    <div class="directory-item-right">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
                
                <div class="directory-item" data-target="feature-toggle-section">
                    <div class="directory-item-left">
                        <svg class="directory-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                        </svg>
                        <span class="directory-item-title">功能开关</span>
                    </div>
                    <div class="directory-item-right">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
                
                <div class="directory-item" data-target="general-section">
                    <div class="directory-item-left">
                        <svg class="directory-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span class="directory-item-title">一般功能</span>
                    </div>
                    <div class="directory-item-right">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
                
                <div class="directory-item" data-target="config-section">
                    <div class="directory-item-left">
                        <svg class="directory-item-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                        <span class="directory-item-title">配置管理</span>
                    </div>
                    <div class="directory-item-right">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- 设置内容区域 -->
            <div class="settings-content">
                <!-- 数据源设置区域 -->
                <div id="data-source-section" class="settings-section p-4 bg-[#151515] rounded-lg shadow-inner">
                    <div class="section-header">
                        <button class="back-button" onclick="showSettingsDirectory()">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h3 class="section-title">数据源设置</h3>
                    </div>
                    
                    <!-- 批量操作按钮 -->
                    <div class="flex space-x-2 mb-3">
                        <button onclick="selectAllAPIs(true)" class="px-2 py-1 bg-[#333] hover:bg-[#444] text-white text-xs rounded">全选</button>
                        <button onclick="selectAllAPIs(false)" class="px-2 py-1 bg-[#333] hover:bg-[#444] text-white text-xs rounded">全不选</button>
                        <button onclick="selectAllAPIs(true, true)" class="px-2 py-1 bg-[#333] hover:bg-[#444] text-white text-xs rounded">全选普通资源</button>
                    </div>
                    
                    <!-- API选择区域 - 使用滚动区域 -->
                    <div class="max-h-60 overflow-y-auto bg-[#191919] p-2 rounded-lg mb-3">
                        <div id="apiCheckboxes">
                            <!-- 这里将动态插入API复选框 -->
                        </div>
                    </div>
                    
                    <!-- API信息显示 -->
                    <div class="text-xs text-gray-500 flex justify-between items-center">
                        <span>已选API数量：<span id="selectedApiCount" class="text-white">0</span></span>
                        <span id="siteStatus" class="ml-2"></span>
                    </div>
                </div>

                <!-- 自定义API管理区域 -->
                <div id="custom-api-section" class="settings-section p-4 bg-[#151515] rounded-lg shadow-inner">
                    <div class="section-header">
                        <button class="back-button" onclick="showSettingsDirectory()">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h3 class="section-title">自定义API</h3>
                    </div>
                    
                    <div class="flex justify-end mb-2">
                        <button onclick="showAddCustomApiForm()" class="bg-[#333] hover:bg-[#444] text-white w-6 h-6 rounded-full text-center leading-none text-lg flex items-center justify-center">+</button>
                    </div>
                    <div id="customApisList" class="max-h-60 overflow-y-auto mb-2">
                        <!-- 自定义API将显示在这里 -->
                    </div>
                    
                    <!-- 添加自定义API表单 (默认隐藏) -->
                    <div id="addCustomApiForm" class="hidden mt-2 p-2 bg-[#191919] rounded-lg">
                        <input type="text" id="customApiName" placeholder="API名称" class="w-full bg-[#222] border border-[#333] text-white px-2 py-1 rounded mb-2" autocomplete="off">
                        <input type="text" id="customApiUrl" placeholder="https://abc.com" class="w-full bg-[#222] border border-[#333] text-white px-2 py-1 rounded mb-2" autocomplete="off">
                        <!-- 添加成人内容切换 -->
                        <div class="flex items-center mb-2">
                            <input type="checkbox" id="customApiIsAdult" class="form-checkbox h-4 w-4 text-pink-500 bg-[#222] border border-[#333]">
                            <label for="customApiIsAdult" class="ml-2 text-xs text-pink-400">黄色资源站</label>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="addCustomApi()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs">添加</button>
                            <button onclick="cancelAddCustomApi()" class="bg-[#444] hover:bg-[#555] text-white px-3 py-1 rounded text-xs">取消</button>
                        </div>
                    </div>
                </div>
                
                <!-- 内容过滤设置区域 -->
                <div id="feature-toggle-section" class="settings-section p-4 bg-[#151515] rounded-lg shadow-inner">
                    <div class="section-header">
                        <button class="back-button" onclick="showSettingsDirectory()">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h3 class="section-title">功能开关</h3>
                    </div>
                    
                    <!-- 黄色内容过滤开关 -->
                    <div class="flex flex-col mb-3 pb-3 border-b border-[#222] relative">
                        <div class="flex items-center justify-between">
                            <div>
                                <label class="text-sm font-medium text-gray-400">黄色内容过滤</label>
                                <p class="text-xs text-gray-500 mt-1 filter-description">过滤"伦理片"等黄色内容</p>
                            </div>
                            <div class="relative inline-block w-12 align-middle select-none">
                                <input type="checkbox" id="yellowFilterToggle" class="opacity-0 absolute w-full h-full cursor-pointer z-10">
                                <div class="toggle-bg bg-[#333] w-12 h-6 rounded-full transition-colors duration-300 ease-in-out"></div>
                                <div class="toggle-dot absolute w-5 h-5 bg-white rounded-full top-0.5 left-0.5 transition-transform duration-300 ease-in-out"></div>
                            </div>
                        </div>
                        <!-- 警告提示将在这里动态插入 -->
                    </div>
                    
                    <!-- 广告过滤开关 -->
                    <div class="flex items-center justify-between mb-3 pb-3 border-b border-[#222]">
                        <div>
                            <label class="text-sm font-medium text-gray-400">分片广告过滤</label>
                            <p class="text-xs text-gray-500 mt-1">关闭可减少旧版浏览器卡顿</p>
                        </div>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" id="adFilterToggle" class="opacity-0 absolute w-full h-full cursor-pointer z-10">
                            <div class="toggle-bg bg-[#333] w-12 h-6 rounded-full transition-colors duration-300 ease-in-out"></div>
                            <div class="toggle-dot absolute w-5 h-5 bg-white rounded-full top-0.5 left-0.5 transition-transform duration-300 ease-in-out"></div>
                        </div>
                    </div>
                    
                    <!-- 豆瓣热门开关 -->
                    <div class="flex items-center justify-between">
                        <div>
                            <label class="text-sm font-medium text-gray-400">豆瓣热门推荐</label>
                            <p class="text-xs text-gray-500 mt-1">首页显示豆瓣热门影视内容</p>
                        </div>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" id="doubanToggle" class="opacity-0 absolute w-full h-full cursor-pointer z-10">
                            <div class="toggle-bg bg-[#333] w-12 h-6 rounded-full transition-colors duration-300 ease-in-out"></div>
                            <div class="toggle-dot absolute w-5 h-5 bg-white rounded-full top-0.5 left-0.5 transition-transform duration-300 ease-in-out"></div>
                        </div>
                    </div>
                </div>

                <!-- 一般功能区域 -->
                <div id="general-section" class="settings-section p-4 bg-[#151515] rounded-lg shadow-inner">
                    <div class="section-header">
                        <button class="back-button" onclick="showSettingsDirectory()">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h3 class="section-title">一般功能</h3>
                    </div>
                    
                    <button onclick="clearLocalStorage()" class="px-4 py-2 mt-2 w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600 text-white rounded-lg text-sm transition-all duration-300 shadow-md hover:shadow-lg">清除页面缓存</button>
                </div>

                <!-- 导入导出配置区域 -->
                <div id="config-section" class="settings-section p-4 bg-[#151515] rounded-lg shadow-inner">
                    <div class="section-header">
                        <button class="back-button" onclick="showSettingsDirectory()">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h3 class="section-title">配置管理</h3>
                    </div>
                    
                    <button onclick="importConfig()" class="px-4 py-2 w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600 text-white rounded-lg text-sm transition-all duration-300 shadow-md hover:shadow-lg">导入配置</button>
                    <button onclick="exportConfig()" class="px-4 py-2 mt-2 w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600 text-white rounded-lg text-sm transition-all duration-300 shadow-md hover:shadow-lg">导出配置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 h-14 bg-[#0a0a0a] border-t border-[#333] flex justify-around items-center px-2 z-30 bottom-nav">

        <!-- 搜索按钮 -->

            </svg>

        <!-- 设置按钮 -->
        <a href="settings.html" class="flex flex-col items-center justify-center w-1/4 text-white text-xs bottom-nav-button active" id="nav-settings">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">

            <p class="text-white text-lg">加载中...</p>
        </div>

        <p id="toastMessage"></p>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>

    <script src="js/password.js"></script>

    <script>
        // 初始化设置导航
        function initSettingsDirectory() {
            // 初始状态只显示目录，隐藏所有设置内容
            document.querySelectorAll('.settings-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // 为目录项添加点击事件
            document.querySelectorAll('.directory-item').forEach(item => {
                item.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const targetSection = document.getElementById(targetId);
                    
                    // 隐藏目录
                    document.getElementById('settings-directory').style.display = 'none';
                    
                    // 显示目标设置区域
                    if (targetSection) {
                        targetSection.classList.add('active');
                    }
                });
            });
            
            // 支持通过URL参数直接导航到特定设置部分
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const section = urlParams.get('section');
                if (section) {
                    const targetItem = document.querySelector(`.directory-item[data-target='${section}']`);
                    if (targetItem) {
                        targetItem.click();
                    }
                }
            } catch (e) {
                console.error('解析URL参数失败:', e);
            }
        }
        
        // 显示设置目录
        function showSettingsDirectory() {
            // 隐藏所有设置区域
            document.querySelectorAll('.settings-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // 显示目录
            document.getElementById('settings-directory').style.display = 'block';
        }
        
        // 页面加载完成后初始化设置页面
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化API选择
            initAPISelection();
            
            // 初始化事件监听器
            initEventListeners();
            
            // 设置导航栏状态
            document.querySelectorAll('.bottom-nav-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav-settings').classList.add('active');
            
            // 检查密码保护状态
            if (typeof safeCheckPasswordProtection === 'function') {
                safeCheckPasswordProtection();
            } else if (typeof checkPasswordProtection === 'function') {
                checkPasswordProtection();
            }
            
            // 设置豆瓣开关初始状态
            const doubanToggle = document.getElementById('doubanToggle');
            if (doubanToggle) {
                doubanToggle.checked = localStorage.getItem('doubanEnabled') === 'true';
            }
            
            // 绑定豆瓣开关事件
            doubanToggle.addEventListener('change', function(e) {
                localStorage.setItem('doubanEnabled', e.target.checked);
            });
            
            // 初始化设置目录
            initSettingsDirectory();
        });
    </script>

    <!-- PWA 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            // 只在HTTP/HTTPS环境下注册ServiceWorker
            if (window.location.protocol === 'https:' || window.location.protocol === 'http:') {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/service-worker.js');
                });
            } else {
                console.warn('ServiceWorker只能在HTTP/HTTPS环境下注册，当前使用的是' + window.location.protocol + '协议');
            }
        }
    </script>
